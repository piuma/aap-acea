---
argument_specs:
  main:
    short_description: "Applica patch zypper a SUSE Linux Enterprise"
    description:
      - >-
        Richiede che il play esegua C(gather_facts), perche' le precondizioni
        leggono C(ansible_facts.os_family) e C(ansible_facts.mounts).
      - >-
        La strategia di rollout (C(serial), C(max_fail_percentage)) e' una
        scelta di play e va espressa nel playbook chiamante.
    options:
      zypper_patching_type:
        type: str
        required: false
        choices: [security, recommended, all]
        description: "Categoria di patch da applicare, oppure aggiornamento completo."
      zypper_patching_check_only:
        type: bool
        required: false
        description: "Elenca soltanto gli aggiornamenti disponibili, senza installarli."
      zypper_patching_allow_reboot:
        type: bool
        required: false
        description: "Autorizza il riavvio quando zypper lo segnala necessario."
      zypper_patching_reboot_timeout:
        type: int
        required: false
        description: "Secondi di attesa del ritorno dell'host dopo il riavvio."
      zypper_patching_post_reboot_delay:
        type: int
        required: false
        description: "Secondi di attesa prima del primo test post-riavvio."
      zypper_patching_refresh_cache:
        type: bool
        required: false
        description: "Esegue zypper refresh prima del censimento."
      zypper_patching_min_free_bytes:
        type: int
        required: false
        description: "Spazio libero minimo richiesto su / o /var, in byte."
      zypper_patching_log_path:
        type: str
        required: false
        description: "File su cui annotare l'intervento di patching."
      zypper_patching_write_log:
        type: bool
        required: false
        description: "Scrive la riga di log sull'host dopo un intervento effettivo."
