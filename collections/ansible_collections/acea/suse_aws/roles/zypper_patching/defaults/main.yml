---
# security     -> solo patch con categoria security
# recommended  -> solo patch raccomandate
# all          -> zypper update completo
zypper_patching_type: security

# Default prudente: senza una scelta esplicita il ruolo si limita a elencare
# cosa verrebbe installato.
zypper_patching_check_only: true

# Riavvio: il ruolo rileva sempre se serve, ma riavvia solo se autorizzato.
zypper_patching_allow_reboot: false
zypper_patching_reboot_timeout: 900
zypper_patching_post_reboot_delay: 30

# Precondizioni
zypper_patching_refresh_cache: true
zypper_patching_min_free_bytes: 1073741824   # 1 GiB su / o /var

# Traccia locale degli interventi, utile in audit
zypper_patching_log_path: /var/log/ansible-patching.log
zypper_patching_write_log: true
