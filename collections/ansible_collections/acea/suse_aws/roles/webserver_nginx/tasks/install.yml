---
- name: "Installa {{ webserver_nginx_package }}"
  community.general.zypper:
    name: "{{ webserver_nginx_package }}"
    state: present
    update_cache: true

- name: "Crea la document root"
  ansible.builtin.file:
    path: "{{ webserver_nginx_docroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Pagina di benvenuto"
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_nginx_docroot }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: "Virtual host nginx"
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/conf.d/{{ webserver_nginx_site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c /etc/nginx/nginx.conf"
  notify: Ricarica nginx

- name: "Avvia e abilita nginx"
  ansible.builtin.systemd_service:
    name: "{{ webserver_nginx_service }}"
    state: started
    enabled: true

- name: "Gestione del firewall"
  when: webserver_nginx_manage_firewall | bool
  block:
    - name: "Stato dei servizi systemd"
      ansible.builtin.service_facts:

    - name: "Apri la porta {{ webserver_nginx_port }} su firewalld"
      ansible.posix.firewalld:
        port: "{{ webserver_nginx_port }}/tcp"
        zone: "{{ webserver_nginx_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      when:
        - ansible_facts.services['firewalld.service'] is defined
        - ansible_facts.services['firewalld.service'].state == 'running'
