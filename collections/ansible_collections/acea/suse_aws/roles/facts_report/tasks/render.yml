---
# Da eseguire su localhost, dopo che il play precedente ha raccolto i fact.
#
#   - hosts: localhost
#     tasks:
#       - ansible.builtin.include_role:
#           name: acea.suse_aws.facts_report
#           tasks_from: render
- name: "Scrivi il report markdown"
  ansible.builtin.template:
    src: inventory_report.md.j2
    dest: "{{ facts_report_path }}"
    mode: "0644"
  delegate_to: localhost

- name: "Stampa il report nel log del job"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.file', facts_report_path).split('\n') }}"
  when: facts_report_print | bool
