[defaults]
inventory               = inventory/aws_ec2.yml
roles_path              = roles
collections_path        = collections
host_key_checking       = False
retry_files_enabled     = False
stdout_callback         = ansible.builtin.default
result_format           = yaml
callbacks_enabled       = ansible.posix.profile_tasks, ansible.posix.timer
interpreter_python      = auto_silent
forks                   = 20
timeout                 = 60
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout    = 3600
display_skipped_hosts   = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.yaml, ansible.builtin.ini
cache          = True
cache_plugin   = jsonfile
cache_timeout  = 300
cache_connection = /tmp/ansible_inventory_cache

# Il plugin amazon.aws.aws_ssm non usa SSH: la sezione [ssh_connection] e'
# irrilevante per gli host SUSE di questo progetto. Resta qui solo nel caso
# si aggiungano host raggiunti via SSH diretto.
[ssh_connection]
pipelining = True

[persistent_connection]
command_timeout = 120
connect_timeout = 120
