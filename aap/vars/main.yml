---
# ===========================================================================
# Parametri della configurazione AAP (config-as-code)
# ===========================================================================
# Modifica questo file, non il playbook.

aap_organization: "Default"

# --- Sorgente del progetto -------------------------------------------------
aap_project_name: "aap-acea"
aap_project_scm_url: "https://github.com/ORGANIZZAZIONE/aap-acea.git"
aap_project_branch: "main"
# Nome di una credential SCM gia' esistente in AAP; lascia "" per repo pubblici.
aap_project_scm_credential: ""

# --- Execution Environment -------------------------------------------------
# ATTENZIONE: questi nomi devono combaciare ESATTAMENTE con gli oggetti gia'
# creati a mano in AAP. I moduli ansible.controller sono idempotenti per nome:
# un nome diverso non aggiorna l'oggetto esistente, ne crea un secondo.
aap_ee_name: "aap-acea-aws-ssm-ee"
# Tag esplicito, non :latest, cosi' si sa sempre quale immagine sta girando.
aap_ee_image: "quay.io/dabbasci/acea/aap-acea-aws-ssm-ee:1.0.0"
# Nome di una credential di tipo "Container Registry"; "" se il registry e'
# pubblico. Quay crea i repository PRIVATI per default: se non l'hai reso
# pubblico, qui serve il nome di una credential con le tue chiavi Quay.
aap_ee_registry_credential: ""

# --- Credential AWS --------------------------------------------------------
aap_aws_credential_name: "AWS - automazione SUSE"
# Passali come extra vars o da vault, NON committarli:
#   -e aws_access_key=... -e aws_secret_key=...
aws_access_key: ""
aws_secret_key: ""
aws_security_token: ""

# --- Ambiente AWS ----------------------------------------------------------
aap_aws_region: "eu-south-1"
# Bucket di transito. Deve poter accettare PUT con SSE-S3/SSE-KMS (o con la sola
# default encryption del bucket): SSE-C non e' utilizzabile dal connection
# plugin. Vedi aws/README.md, sezione "SSE-C".
aap_ssm_bucket: "aws-aceh-aap-tst-s3-01"

# --- Inventario ------------------------------------------------------------
# Anche qui: nomi identici a quelli gia' presenti in AAP, altrimenti il
# playbook crea un secondo inventario invece di aggiornare il tuo.
aap_inventory_name: "AWS - EC2 SUSE Demo"
aap_inventory_source_name: "EC2 dinamico (tag AnsibleManaged)"
